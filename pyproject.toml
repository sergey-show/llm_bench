[project]
name = "llm-bench"
version = "0.2.0"
description = "Production LLM comparison bench with calibration, jobs API, and HTML reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "jinja2>=3.1.0",
  "streamlit>=1.36.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "cryptography>=42.0.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5.0", "pytest>=8.0.0"]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_bench*"]

[tool.setuptools.package-data]
llm_bench = ["reports/templates/*.html"]
